<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Door Frame -->
  <rect x="144" y="96" width="224" height="320" rx="16" fill="none" stroke="#3f3f46" stroke-width="8"/>

  <!-- Door Inner Panel -->
  <rect x="156" y="108" width="200" height="296" rx="10" fill="url(#doorGrad)"/>

  <!-- Door Panels (Bevels) -->
  <rect x="176" y="132" width="160" height="100" rx="8" fill="#18181b" stroke="#27272a" stroke-width="4"/>
  <rect x="176" y="252" width="160" height="132" rx="8" fill="#18181b" stroke="#27272a" stroke-width="4"/>

  <!-- Door Handle / Lock -->
  <circle cx="320" cy="288" r="10" fill="url(#accentGrad)"/>
  <rect x="318" y="288" width="4" height="12" rx="2" fill="url(#accentGrad)"/>

  <!-- Ephemeral Signal Wave / Subtle Glow -->
  <path d="M 236 72 C 248 64, 264 64, 276 72" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 220 54 C 242 42, 270 42, 292 54" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
</svg>
