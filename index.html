<!doctype html>

  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100dvh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #f4f4f5; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; padding: 1.5rem;">

        <div style="margin-top: 16px; width: 24px; height: 24px; border: 2px solid rgba(52, 211, 153, 0.2); border-top-color: #34d399; border-radius: 50%; animation: spin 1s linear infinite;"></div>
